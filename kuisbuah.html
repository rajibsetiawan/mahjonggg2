<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kuis Buah Ceria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/kuisbuah.css">
</head>
<body>

  <!-- HEADER -->
  <div class="top-bar">
    <a href="games.html" class="icon-btn">🎮</a>
    <h1>🍎 Kuis Buah Ceria 🍌</h1>
    <button class="icon-btn" id="btnSoal">🔊</button>
  </div>
    <p class="instruction">Tekan PLAY lalu pilih angka</p>

  <!-- PLAY -->
  <button class="play-btn" id="btnPlay">▶️</button>

  <!-- GAME -->
  <div class="question-box">
    <img id="questionImage" src="apel.png" alt="buah">
  </div>

  <div class="answers" id="answerBox">
    <!-- diisi JS -->
  </div>

  <!-- POPUP -->
  <div class="popup" id="popupBenar">
    <div class="popup-box">
      <h2>🎉 KAMU BENAR!!! 🎉</h2>
      <button class="answer-btn" id="btnNext">Soal Selanjutnya >>></button>
    </div>
  </div>

  <!-- AUDIO -->
  <audio id="soundSoal"></audio>
  <audio id="soundBenar" src="sounds/benar.mp3"></audio>
  <audio id="soundSalah" src="sounds/salah.mp3"></audio>

  <script src="js/kuisbuah.js"></script>
</body>
</html>
